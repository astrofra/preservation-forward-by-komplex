<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>k o m p l e x .:. f o r w a r d</title>
  <link rel="stylesheet" href="player.css">
  <script defer src="forward.js"></script>
  <script defer src="player.js"></script>
</head>
<body>
  <main>
    <div class="intro">
      <img class="artwork" src="art/aijja.gif" width="309" height="273" alt="Komplex eternal">
      <div class="about">
        <p><strong>a demonstration</strong></p>
        <h1>“ f o r w a r d ”</h1>
        <p>by <strong>komplex</strong></p>
        <p class="provenance">Original Java release v1.02<br>April 24th, 1998</p>
        <p>C++ / WebAssembly preservation edition</p>
        <p>512 × 256 · 1:1 rendering<br>Stereo XM music · 50 Hz visuals</p>
        <button id="start" disabled>Start demo</button>
        <p id="status" role="status" aria-live="polite">Loading the demo…</p>
        <progress id="progress" max="1" value="0" aria-label="Loading progress"></progress>
      </div>
    </div>
    <section id="player" aria-label="Forward demo player" hidden>
      <div id="viewport"><canvas id="canvas" width="512" height="256" aria-label="Forward animation"></canvas></div>
      <div class="controls">
        <button id="pause" disabled>Pause</button>
        <button id="restart" disabled>Restart</button>
        <button id="mute" aria-pressed="false">Mute</button>
        <button id="fullscreen">Fullscreen</button>
        <span id="position"></span>
      </div>
    </section>
    <noscript>This edition requires JavaScript and WebAssembly.</noscript>
  </main>
</body>
</html>
